<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Walkthrough</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 12px; background: rgba(20,18,16,.72); padding: 10px 12px; border-radius: 8px; max-width: 280px; }
    #hud h1 { font-size: 14px; margin: 0 0 6px; }
    #hud select, #hud input, #hud button { font: inherit; }
    #hud .row { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #hud .keys { opacity: .75; font-size: 12px; }
    #ref { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; opacity: 0; }
    #err { position: fixed; right: 12px; bottom: 12px; color: #f88; white-space: pre-wrap; max-width: 40vw; }
    #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.6); display: none; }
    body.shot #hud, body.shot #cross, body.shot #err { display: none; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
</head>
<body>
  <img id="ref" alt="">
  <div id="cross"></div>
  <div id="hud">
    <h1>House walkthrough</h1>
    <div class="keys">Click the scene to walk · WASD / arrows to move · mouse to look · Shift to run · Esc to release</div>
    <div class="row">Jump to: <select id="views"></select></div>
    <div class="row">Photo overlay <input id="refop" type="range" min="0" max="1" step="0.05" value="0"></div>
    <div class="row" id="where"></div>
  </div>
  <div id="err"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
